name: Test portrait pairing upstream branch

on:
  push:
    branches:
      - feature/portrait-pairing-upstream
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check wallpanel-src.js
      - run: node --check portrait-pairing.js
      - run: node --check wallpanel-src-entry.js
      - run: npx rollup wallpanel-src-entry.js --file /tmp/wallpanel-portrait-pairing.js --format iife
